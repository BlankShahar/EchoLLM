[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echollm-sage"
version = "0.1.0"
description = "SAGE and SPARQ semantic cache policies for EchoLLM"
requires-python = ">=3.11"
dependencies = [
  "adaptive_pipeline~=0.1.0",
  "cachetools~=6.2.0",
  "faiss-cpu~=1.12.0",
  "jinja2~=3.1.6",
  "numpy~=2.3.3",
  "ollama~=0.5.4",
  "openai~=1.108.2",
  "pydantic~=2.11.9",
  "sentence-transformers~=5.1.1",
  "tqdm~=4.67.1",
]

[project.optional-dependencies]
experiments = [
  "datasets>=2.19",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "psutil>=5.9",
  "pyarrow>=16",
  "PyYAML>=6",
  "scikit-learn>=1.4",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cache*", "echollm*", "experiments*", "llm*", "text_similarity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
