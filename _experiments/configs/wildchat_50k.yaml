dataset:
  kind: wildchat
  source: huggingface
  dataset_name: allenai/WildChat-1M
  split: train
  language: null
  source_models: null
  max_pairs: 50000
  streaming: true

embedding:
  prompt_model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  quality_model_name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  batch_size: 128
  device: null
  cache_path: .cache/echollm_embeddings.sqlite3

trace:
  mode: chronological
  request_count: null
  warmup_requests: 0
  seed: 7
  zipf_alpha: 1.1
  cluster_count: 1000

llm:
  provider: ollama
  model: qwen3:8b
  host: http://127.0.0.1:11434
  options:
    num_predict: 256
    temperature: 0.0
    seed: 7

policy:
  policies: [LRU, LFU, FIFO, RR, SAGE]
  cache_sizes: [0, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 20000]
  include_unbounded_cache: true
  hit_distance_threshold: 0.25
  sage_ghost_capacity: null
  sage_decay_half_life_requests: 512
  sage_admission_margin: 0.0
  sage_current_request_weight: 0.1
  sage_window_fraction: 0.05
  sage_soft_coverage: true
  sage_soft_coverage_power: 1.0
  sage_recent_history_multiplier: 4.0
  sage_recent_history_limit: 4096
  sage_long_history_capacity: null
  sage_long_history_multiplier: 8.0
  sage_long_history_limit: 8192
  sage_long_sample_stride: 8
  sage_recent_evidence_weight: 0.7
  sage_long_decay_half_life_requests: 32768

quality:
  good_hit_distance_thresholds: [0.1, 0.2, 0.3]

resources:
  enabled: true
  sample_interval_requests: 100

output:
  directory: results
  run_name: wildchat_50k_sage
  write_raw_results: true
  generate_plots: true
