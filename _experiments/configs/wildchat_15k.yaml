dataset:
  kind: wildchat
  source: huggingface
  dataset_name: allenai/WildChat-1M
  split: train
  language: null
  source_models: null
  max_pairs: 15000
  streaming: true

embedding:
  prompt_model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  quality_model_name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  batch_size: 128
  device: null
  cache_path: .cache/echollm_embeddings.sqlite3

trace:
  mode: chronological
  request_count: null
  warmup_requests: 0
  seed: 7
  zipf_alpha: 1.1
  cluster_count: 1000

llm:
  provider: ollama
  model: qwen3:4b-instruct
  host: http://127.0.0.1:11434
  options:
    num_predict: 64
    temperature: 0.0
    seed: 7

policy:
  policies: [LRU, LFU, FIFO, RR, SAGE, SPARQ]
  # Sweep the bounded regime through the practically unbounded endpoint.
  cache_sizes: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000, 14000, 15000]
  include_unbounded_cache: false
  # Freeze one threshold for every policy; recalibrate only per dataset/embedder.
  hit_distance_threshold: 0.25
  sage_ghost_capacity: null
  sage_decay_half_life_requests: null
  sage_admission_margin: 0.0
  sage_current_request_weight: 1.0
  sage_frequency_weight: 5.0
  # WildChat has short request bursts (exact-repeat median gap ~= 28), so half
  # the cache is the LRU probation segment and half is SAGE's semantic main.
  sage_window_fraction: 0.50
  sage_soft_coverage: false
  sage_soft_coverage_power: 1.0
  sage_recent_history_multiplier: 2.0
  sage_recent_history_limit: 4096
  sage_long_history_capacity: null
  sage_long_history_multiplier: 4.0
  sage_long_history_limit: 8192
  sage_long_sample_stride: 4
  sage_recent_evidence_weight: 0.75
  sage_long_decay_half_life_requests: null
  sparq_window_fraction: 0.50
  sparq_credit_power: 2.0
  sparq_aging_interval_requests: null
  sparq_aging_factor: 0.5
  sparq_admission_margin: 0.0
  sparq_initial_score: 1.0

quality:
  good_hit_distance_thresholds: [0.1, 0.2, 0.3]

resources:
  enabled: true
  sample_interval_requests: 100

output:
  directory: results
  run_name: wildchat_15k_cache_policy_comparison
  write_raw_results: true
  generate_plots: true
