dataset:
  source: huggingface
  dataset_name: OpenAssistant/oasst1
  split: [train, validation]
  language: null
  exclude_deleted: false
  require_positive_review: false
  max_pairs: null
  response_selection: all

embedding:
  prompt_model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  quality_model_name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
  batch_size: 128
  device: null
  cache_path: .cache/echollm_embeddings.sqlite3

trace:
  mode: chronological
  request_count: null
  warmup_requests: 0
  seed: 7
  zipf_alpha: 1.1
  cluster_count: 1000

llm:
  provider: ollama
  model: qwen3:8b
  host: http://127.0.0.1:11434
  options:
    num_predict: 256
    temperature: 0.0
    seed: 7

policy:
  policies: [LRU, LFU, FIFO, RR, SAGE]
  cache_sizes: [0, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 20000]
  include_unbounded_cache: true
  hit_distance_threshold: 0.25
  sage_ghost_capacity: 4096
  sage_decay_half_life_requests: 2048
  sage_admission_margin: 0.0
  sage_current_request_weight: 0.1

quality:
  good_hit_distance_thresholds: [0.1, 0.2, 0.3]

resources:
  enabled: true
  sample_interval_requests: 100

output:
  directory: results
  run_name: oasst1_all_sage
  write_raw_results: true
  generate_plots: true
