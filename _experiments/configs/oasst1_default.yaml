dataset:
  source: huggingface
  dataset_name: OpenAssistant/oasst1
  split: [train, validation]
  language: en
  max_pairs: null
  response_selection: top_rank

embedding:
  prompt_model_name: sentence-transformers/all-MiniLM-L6-v2
  quality_model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 128
  device: null
  cache_path: .cache/echollm_embeddings.sqlite3

trace:
  mode: chronological
  request_count: null
  warmup_requests: 0
  seed: 7
  zipf_alpha: 1.1
  cluster_count: 1000

llm:
  provider: ollama
  model: llama3.2:1b
  host: http://127.0.0.1:11434
  options:
    num_predict: 256

policy:
  policies: [LRU, LFU, FIFO, RR, SAGE]
  cache_sizes: [0, 50, 100, 250, 500, 1000, 2500, 5000, 10000]
  include_unbounded_cache: true
  hit_distance_threshold: 0.18
  sage_ghost_capacity: 4096
  sage_decay_half_life_requests: 10000
  sage_admission_margin: 0.0

quality:
  good_hit_distance_thresholds: [0.1, 0.2, 0.3]

resources:
  enabled: true
  sample_interval_requests: 100

output:
  directory: results
  run_name: oasst1_sage
  write_raw_results: true
  generate_plots: true
